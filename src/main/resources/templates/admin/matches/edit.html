<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">

        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="d-flex justify-content-between
                            align-items-center mb-4">
                    <h2 th:text="${match.homeTeam}
                        + ' vs ' + ${match.awayTeam}">
                        Match
                    </h2>
                    <a href="/admin"
                       class="btn btn-outline-secondary btn-sm">
                        ← Back to Dashboard
                    </a>
                </div>

                <!-- Error message -->
                <div th:if="${param.error}"
                     class="alert alert-danger">
                    Something went wrong — please try again.
                </div>

                <!-- Already scored info -->
                <div th:if="${match.scored}"
                     class="alert alert-info mb-3">
                    ✓ This match has been scored. Updating the
                    result will automatically recalculate
                    all points.
                </div>

                <!-- Single edit form -->
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0">Edit Fixture</h5>
                    </div>
                    <div class="card-body p-4">
                        <form method="post"
                              th:action="@{/admin/matches/{id}/edit
                              (id=${match.id})}">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>

                            <!-- Group -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Group
                                </label>
                                <select name="groupName"
                                        class="form-select"
                                        required>
                                    <option th:each="group : ${groups}"
                                            th:value="${group}"
                                            th:text="'Group ' + ${group}"
                                            th:selected="${match.groupName
                                                == group}">
                                        Group A
                                    </option>
                                </select>
                            </div>

                            <!-- Home team -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Home Team
                                </label>
                                <input type="text"
                                       name="homeTeam"
                                       class="form-control"
                                       th:value="${match.homeTeam}"
                                       maxlength="100"
                                       required/>
                            </div>

                            <!-- Away team -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Away Team
                                </label>
                                <input type="text"
                                       name="awayTeam"
                                       class="form-control"
                                       th:value="${match.awayTeam}"
                                       maxlength="100"
                                       required/>
                            </div>

                            <!-- Kick off time -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Kick Off Time
                                </label>
                                <input type="datetime-local"
                                       name="kickOffTime"
                                       class="form-control"
                                       th:value="${#temporals.format(
                                           match.kickOffTime,
                                           'yyyy-MM-dd''T''HH:mm')}"
                                       required/>
                            </div>

                            <!-- Status -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Status
                                </label>
                                <select name="status"
                                        class="form-select"
                                        id="statusSelect"
                                        onchange="toggleResult()">
                                    <option value="SCHEDULED"
                                            th:selected="${match.status
                                                == 'SCHEDULED'}">
                                        Scheduled
                                    </option>
                                    <option value="IN_PROGRESS"
                                            th:selected="${match.status
                                                == 'IN_PROGRESS'}">
                                        In Progress
                                    </option>
                                    <option value="COMPLETED"
                                            th:selected="${match.status
                                                == 'COMPLETED'}">
                                        Completed
                                    </option>
                                </select>
                            </div>

                            <!-- Result — only shown when COMPLETED -->
                            <div id="resultSection"
                                 th:classappend="${match.status
                                     != 'COMPLETED'} ? 'd-none'">
                                <hr/>
                                <h6 class="mb-3">Result</h6>

                                <!-- Current result with clear button -->
                                <div th:if="${match.homeScore != null}"
                                     class="mb-3">
                                    <span class="text-muted small">
                                        Current result:
                                        <strong>
                                            <span th:text="${match.homeTeam}">
                                                Home
                                            </span>
                                            <span th:text="${match.homeScore}">
                                                0
                                            </span>
                                            -
                                            <span th:text="${match.awayScore}">
                                                0
                                            </span>
                                            <span th:text="${match.awayTeam}">
                                                Away
                                            </span>
                                        </strong>
                                    </span>
                                    <button type="button"
                                            class="btn btn-sm
                                                   btn-outline-danger
                                                   ms-2"
                                            onclick="clearScores()">
                                        Clear Scores
                                    </button>
                                </div>

                                <div class="row align-items-center g-3">
                                    <div class="col-md-5">
                                        <label class="form-label"
                                               th:text="${match.homeTeam}">
                                            Home
                                        </label>
                                        <input type="number"
                                               name="homeScore"
                                               id="homeScore"
                                               class="form-control"
                                               min="0"
                                               max="20"
                                               th:value="${match.homeScore
                                                   != null ?
                                                   match.homeScore : ''}"/>
                                    </div>
                                    <div class="col-md-1
                                                text-center pt-4">
                                        <span class="fw-bold">-</span>
                                    </div>
                                    <div class="col-md-5">
                                        <label class="form-label"
                                               th:text="${match.awayTeam}">
                                            Away
                                        </label>
                                        <input type="number"
                                               name="awayScore"
                                               id="awayScore"
                                               class="form-control"
                                               min="0"
                                               max="20"
                                               th:value="${match.awayScore
                                                   != null ?
                                                   match.awayScore : ''}"/>
                                    </div>
                                </div>

                                <p class="text-muted small mt-2">
                                    Leave scores blank to clear
                                    the result and remove points
                                    from all users.
                                </p>

                            </div>

                            <hr/>

                            <!-- Submit -->
                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Save Changes
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </div>

        <!-- Scripts -->
        <script>
            function toggleResult() {
                const status = document
                        .getElementById('statusSelect').value;
                const resultSection = document
                        .getElementById('resultSection');
                if (status === 'COMPLETED') {
                    resultSection.classList.remove('d-none');
                } else {
                    resultSection.classList.add('d-none');
                }
            }

            function clearScores() {
                document.getElementById('homeScore').value = '';
                document.getElementById('awayScore').value = '';
            }
        </script>

    </div>
</div>
</body>
</html>
