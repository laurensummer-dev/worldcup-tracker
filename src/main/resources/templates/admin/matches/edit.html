<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">

        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between
                            align-items-center mb-4">
                    <h2 th:text="${match.homeTeam}
                        + ' vs ' + ${match.awayTeam}">
                        Match
                    </h2>
                    <a href="/admin"
                       class="btn btn-outline-secondary btn-sm">
                        ← Back to Dashboard
                    </a>
                </div>

                <!-- Error message -->
                <div th:if="${param.error}"
                     class="alert alert-danger">
                    Something went wrong — please try again.
                </div>

                <!-- Update status -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Update Status</h5>
                    </div>
                    <div class="card-body">
                        <form method="post"
                              th:action="@{/admin/matches/{id}/status
                              (id=${match.id})}">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <div class="d-flex gap-2">
                                <select name="status"
                                        class="form-select">
                                    <option value="SCHEDULED"
                                            th:selected="${match.status
                                            == 'SCHEDULED'}">
                                        Scheduled
                                    </option>
                                    <option value="IN_PROGRESS"
                                            th:selected="${match.status
                                            == 'IN_PROGRESS'}">
                                        In Progress
                                    </option>
                                    <option value="COMPLETED"
                                            th:selected="${match.status
                                            == 'COMPLETED'}">
                                        Completed
                                    </option>
                                </select>
                                <button type="submit"
                                        class="btn btn-primary">
                                    Update
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Enter result -->
                <div class="card shadow-sm"
                     th:if="${!match.scored}">
                    <div class="card-header">
                        <h5 class="mb-0">Enter Result</h5>
                    </div>
                    <div class="card-body">
                        <form method="post"
                              th:action="@{/admin/matches/{id}/result
                              (id=${match.id})}">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>

                            <div class="row align-items-center g-3">
                                <div class="col-md-5">
                                    <label class="form-label"
                                           th:text="${match.homeTeam}">
                                        Home
                                    </label>
                                    <input type="number"
                                           name="homeScore"
                                           class="form-control"
                                           min="0"
                                           max="20"
                                           th:value="${match.homeScore
                                           != null ? match.homeScore : 0}"
                                           required/>
                                </div>
                                <div class="col-md-1 text-center pt-4">
                                    <span class="fw-bold">-</span>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label"
                                           th:text="${match.awayTeam}">
                                        Away
                                    </label>
                                    <input type="number"
                                           name="awayScore"
                                           class="form-control"
                                           min="0"
                                           max="20"
                                           th:value="${match.awayScore
                                           != null ? match.awayScore : 0}"
                                           required/>
                                </div>
                            </div>
                            <button type="submit"
                                    class="btn btn-success w-100 mt-3">
                                Enter Result & Award Points
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Already scored -->
                <div class="card shadow-sm"
                     th:if="${match.scored}">
                    <div class="card-body text-center text-muted">
                        ✓ This match has been scored and points awarded.
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>
