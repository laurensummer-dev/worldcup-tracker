<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">

        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="d-flex justify-content-between
                            align-items-center mb-4">
                    <h1>Create Fixture</h1>
                    <a href="/admin"
                       class="btn btn-outline-secondary btn-sm">
                        ← Back to Dashboard
                    </a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form method="post"
                              action="/admin/matches/create">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>

                            <div class="mb-3">
                                <label class="form-label">
                                    Group
                                </label>
                                <select name="groupName"
                                        class="form-select"
                                        required>
                                    <option value="">
                                        Select a group...
                                    </option>
                                    <option th:each="group : ${groups}"
                                            th:value="${group}"
                                            th:text="'Group ' + ${group}">
                                        Group A
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Home Team
                                </label>
                                <input type="text"
                                       name="homeTeam"
                                       class="form-control"
                                       placeholder="e.g. England"
                                       maxlength="100"
                                       required autofocus/>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Away Team
                                </label>
                                <input type="text"
                                       name="awayTeam"
                                       class="form-control"
                                       placeholder="e.g. France"
                                       maxlength="100"
                                       required/>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">
                                    Kick Off Time
                                </label>
                                <input type="datetime-local"
                                       name="kickOffTime"
                                       class="form-control"
                                       required/>
                            </div>

                            <button type="submit"
                                    class="btn btn-success w-100">
                                Create Fixture
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
</body>
</html>
