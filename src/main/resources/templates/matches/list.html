<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">

        <div class="d-flex justify-content-between
                    align-items-center mb-4">
            <h1>Matches</h1>
        </div>

        <div th:if="${!#lists.isEmpty(allMatches)}">

            <div th:if="${matchService.hasTournamentStarted()}"
                 class="alert alert-warning mb-4">
                Predictions are now locked — the tournament
                has begun!
            </div>

            <div th:unless="${matchService.hasTournamentStarted()}"
                 th:classappend="${matchService.isLocked(allMatches[0])} ?
                     'alert-warning' : 'alert-info'"
                 class="alert mb-4">
                <div class="d-flex align-items-center
                            justify-content-between">
                    <div>
                        <span th:if="${matchService
                                .isLocked(allMatches[0])}">
                            Predictions are locked —
                        </span>
                        <span th:unless="${matchService
                                .isLocked(allMatches[0])}">
                            Predictions lock 1 hour before
                        </span>
                        <strong th:text="${allMatches[0].homeTeam}">
                            Team
                        </strong>
                        vs
                        <strong th:text="${allMatches[0].awayTeam}">
                            Team
                        </strong>
                    </div>
                    <div class="text-end">
                        <span class="text-muted small">
                            Locks in:
                        </span><br/>
                        <span id="countdown"
                              class="fw-bold fs-5 text-danger">
                            Calculating...
                        </span>
                    </div>
                </div>
            </div>

        </div>

        <div th:if="${#lists.isEmpty(allMatches)}"
             class="alert alert-info">
            No matches scheduled yet — check back soon!
        </div>

        <div th:unless="${#lists.isEmpty(groups)}"
             class="mb-4">
            <h5 class="mb-3">Select a Group</h5>
            <div class="d-flex flex-wrap gap-2">
                <button th:each="group : ${groups}"
                        th:text="'Group ' + ${group}"
                        class="btn btn-outline-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#groupModal"
                        th:attr="hx-get=${'/matches/group/' + group},
                                 hx-target='#modal-body-content',
                                 hx-swap='innerHTML',
                                 hx-trigger='click',
                                 onclick='setModalTitle(this.innerText)'">
                    Group A
                </button>
            </div>
        </div>

        <div class="modal fade"
             id="groupModal"
             tabindex="-1"
             aria-labelledby="groupModalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-xl
                        modal-fullscreen-md-down
                        modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"
                            id="groupModalLabel">
                            Group Fixtures
                        </h5>
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close">
                        </button>
                    </div>
                    <div class="modal-body"
                         id="modal-body-content">
                        <div class="text-center p-4 text-muted">
                            Loading fixtures...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script th:if="${!#lists.isEmpty(allMatches)
                        and !matchService.hasTournamentStarted()}"
                th:inline="javascript">
            const kickOffTime = /*[[${#temporals.format(
                allMatches[0].kickOffTime,
                'yyyy-MM-dd''T''HH:mm:ss')}]]*/ '2026-01-01T00:00:00';

            function updateCountdown() {
                const kickOff = new Date(kickOffTime);
                const lockTime = new Date(
                    kickOff.getTime() - 60 * 60 * 1000);
                const now = new Date();
                const diff = lockTime - now;

                if (diff <= 0) {
                    const el = document
                            .getElementById('countdown');
                    if (el) {
                        el.textContent = 'Predictions locked!';
                    }
                    clearInterval(timer);
                    return;
                }

                const days = Math.floor(
                    diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor(
                    (diff % (1000 * 60 * 60 * 24))
                    / (1000 * 60 * 60));
                const minutes = Math.floor(
                    (diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor(
                    (diff % (1000 * 60)) / 1000);

                let display = '';
                if (days > 0) display += days + 'd ';
                if (hours > 0 || days > 0) display += hours + 'h ';
                if (minutes > 0 || hours > 0 || days > 0)
                    display += minutes + 'm ';
                display += seconds + 's';

                const el = document.getElementById('countdown');
                if (el) el.textContent = display;
            }

            updateCountdown();
            const timer = setInterval(updateCountdown, 1000);
        </script>

        <script>
            function setModalTitle(groupText) {
                document.getElementById('groupModalLabel')
                    .textContent = groupText + ' Fixtures';
            }
        </script>

    </div>
</div>
</body>
</html>
